<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>XX电商 · 订单录入与销售看板</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .box { border:1px solid #ddd; padding:10px; margin:10px 0; }
    .clock { font-size: 20px; font-weight: bold; color: #336699; }
    label { display:inline-block; width:120px; }
    table { border-collapse: collapse; width:100%; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:4px 8px; text-align:center; }
  </style>
</head>
<body>

<!-- 顶部标题与优惠提示 -->
<script>
  // 文档写入标题与欢迎语
  document.write("<h1>XX电商 · 运营后台 · 订单录入与销售看板</h1>");
  document.write("<p>欢迎使用内部工具，实时查看订单与销售情况。</p>");

  // 全局优惠政策提示（含学号末位2专属规则）
  document.write(`
  <div style="padding:12px; background:#eef9ff; border-left:5px solid #3aa0e6; margin:10px 0; font-size:15px;">
    <strong>💡 温馨提示：本店当前可享受的优惠与加价政策如下：</strong>
    <ul style="margin:8px 0 0 20px; line-height:1.6;">
      <li>🎉 VIP 客户享受 <strong>9 折优惠</strong></li>
      <li>⚡ 加急发货价格会 <strong>×1.1</strong></li>
      <li>⏰ 每小时前 10 分钟再享 <strong>8.5 折</strong></li>
      <li>🎯 普通客户购买 <strong>3件以上</strong> 额外享受 9 折（学号末位2专属）</li>
    </ul>
  </div>
  `);

  // 动态时段提示（前10分钟优惠/非优惠时段）
  var nowForBanner = new Date();
  var minuteForBanner = nowForBanner.getMinutes();
  if (minuteForBanner >= 0 && minuteForBanner <= 9) {
    document.write(`
      <div style="padding:12px; background:#fffbe6; border-left:5px solid #f4d06f; margin:10px 0; font-size:15px;">
        ⏳ 当前为前 10 分钟！本单可额外享受 <strong>8.5 折</strong> 时段优惠！
      </div>
    `);
  } else {
    document.write(`
      <div style="padding:12px; background:#f5f5f5; border-left:5px solid #ccc; margin:10px 0; font-size:15px;">
        🕒 小贴士：每个整点前 10 分钟享受 8.5 折优惠，普通客户买3件以上再享9折～
      </div>
    `);
  }
</script>

<!-- 时钟区域 -->
<div class="box">
  <h2>当前系统时间</h2>
  <div id="clock" class="clock"></div>
</div>

<!-- 订单录入表单 -->
<div class="box">
  <h2>新建订单</h2>
  <form onsubmit="return validateForm();">
    <p>
      <label>客户名称：</label>
      <input type="text" id="customerName" placeholder="请输入客户姓名">
    </p>
    <p>
      <label>商品单价（¥）：</label>
      <input type="text" id="priceInput" placeholder="请输入大于0的数字">
    </p>
    <p>
      <label>数量（件）：</label>
      <input type="text" id="qtyInput" placeholder="请输入大于0的整数">
    </p>
    <p>
      <label>客户类型：</label>
      <select id="customerType">
        <option value="normal">普通客户</option>
        <option value="vip">VIP 客户</option>
      </select>
    </p>
    <p>
      <label>加急发货：</label>
      <input type="checkbox" id="urgentFlag"> 是
    </p>
    <p><button type="submit">添加订单</button></p>
  </form>
  <div id="orderResult"></div>
</div>

<!-- 销售看板 -->
<div class="box">
  <h2>销售看板</h2>
  <div id="dashboard"></div>
  <div id="orderTable"></div>
</div>

<script>
  // ================================================================
  // 模拟时钟功能（参考246页Date对象用法）
  // ================================================================
  function padZero(n) {
    return n < 10 ? "0" + n : n;
  }

  function updateClock() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1; // 月份从0开始，需+1
    var d = now.getDate();
    var hh = now.getHours();
    var mm = now.getMinutes();
    var ss = now.getSeconds();
    var weekNames = ["日", "一", "二", "三", "四", "五", "六"];
    var w = weekNames[now.getDay()]; // getDay()返回0-6（周日-周六）
    var timeStr = y + "年" + padZero(m) + "月" + padZero(d) + "日 星期" + w + " " + padZero(hh) + ":" + padZero(mm) + ":" + padZero(ss);
    document.getElementById("clock").innerHTML = timeStr;
  }

  // 页面加载时执行一次，之后每秒更新一次
  updateClock();
  setInterval(updateClock, 1000);

  // ================================================================
  // 全局订单数组（存储所有订单记录）
  // ================================================================
  var orders = [];

  // ================================================================
  // 表单校验逻辑（参考233页函数参数传递+227页逻辑或）
  // ================================================================
  function validateForm() {
    var nameStr = document.getElementById("customerName").value;
    var priceStr = document.getElementById("priceInput").value;
    var qtyStr = document.getElementById("qtyInput").value;
    var typeStr = document.getElementById("customerType").value;
    var urgentChecked = document.getElementById("urgentFlag").checked;
    var valid = true;

    // 1. 客户名称校验（不能为空）
    if (nameStr == null || nameStr.trim() === "") {
      alert("客户名称不能为空！");
      valid = false;
    }

    // 2. 商品单价校验（必须是大于0的数字）
    var price = parseFloat(priceStr);
    if (isNaN(price) || price <= 0) {
      alert("商品单价必须是大于0的数字！");
      valid = false;
    }

    // 3. 数量校验（必须是大于0的整数）
    var qty = parseInt(qtyStr, 10);
    if (isNaN(qty) || qty <= 0) {
      alert("数量必须是大于0的整数！");
      valid = false;
    }

    // 校验失败提示
    if (!valid) {
      document.getElementById("orderResult").innerHTML = "<p style='color:red;'>订单录入失败，请检查输入。</p>";
      return false;
    }

    // 校验通过，处理订单
    processOrder(nameStr.trim(), price, qty, typeStr === "vip", urgentChecked);
    return false; // 阻止表单默认提交行为
  }

  // ================================================================
  // 订单业务逻辑（含学号末位2专属规则：普通客户数量>3额外9折）
  // ================================================================
  function processOrder(customerName, price, quantity, isVip, isUrgent) {
    // ① 计算基础金额（单价×数量）
    var baseTotal = price * quantity;

    // ② VIP优惠：9折（普通客户无）
    var afterVip = isVip ? baseTotal * 0.9 : baseTotal;

    // ③ 加急加价：×1.1（不加急则保持原价）
    var afterUrgent = isUrgent ? afterVip * 1.1 : afterVip;

    // ④ 时段折扣：每小时前10分钟8.5折
    var now = new Date();
    var minute = now.getMinutes();
    var hitTimeDiscount = false;
    var finalTotal = afterUrgent;

    if (minute >= 0 && minute <= 9) {
      finalTotal *= 0.85;
      hitTimeDiscount = true;
    }

    // 🔥 学号末位2专属规则：普通客户+数量>3件 → 额外9折
    var extraDiscount = false;
    if (!isVip && quantity > 3) {
      finalTotal *= 0.9;
      extraDiscount = true;
    }

    // 订单重要性判断（VIP且最终金额>1000为大额订单）
    var isImportant = isVip && finalTotal > 1000;

    // 拼接优惠详情（换行显示）
    var tipsHtml = "<ul style='line-height:1.8;'>";
    tipsHtml += isVip ? "<li>VIP 9折已应用</li>" : "<li>普通客户无VIP优惠</li>";
    tipsHtml += isUrgent ? "<li>加急 ×1.1 已应用</li>" : "<li>未加急（无加价）</li>";
    tipsHtml += hitTimeDiscount ? "<li>命中前10分钟 ×0.85 时段折扣</li>" : "<li>无时段折扣</li>";
    // 显示专属额外折扣
    tipsHtml += extraDiscount ? "<li>普通客户数量>3件 → 额外9折（学号末位2专属）</li>" : "";
    tipsHtml += "</ul>";

    // 显示订单结果（逐行输出各环节金额）
    document.getElementById("orderResult").innerHTML =
      "<h3 style='color:#3aa0e6;'>订单录入成功：</h3>" +
      "<p>客户名称：" + customerName + "</p>" +
      "<p>基础金额：¥" + baseTotal.toFixed(2) + "</p>" +
      "<p>VIP优惠后：¥" + afterVip.toFixed(2) + "</p>" +
      "<p>加急处理后：¥" + afterUrgent.toFixed(2) + "</p>" +
      (hitTimeDiscount ? "<p>时段折扣后：¥" + (afterUrgent * 0.85).toFixed(2) + "</p>" : "") +
      (extraDiscount ? "<p>专属额外折扣后：¥" + finalTotal.toFixed(2) + "</p>" : "") +
      "<p style='font-weight:bold; color:#e63946;'>最终金额：¥" + finalTotal.toFixed(2) + "</p>" +
      "<p>订单类型：" + (isImportant ? "<span style='color:#ff9f1c;'>大额VIP订单</span>" : "普通订单") + "</p>" +
      "<div style='background:#eef; padding:10px; margin-top:10px; border-radius:4px;'>" +
      "<strong>优惠详情：</strong>" + tipsHtml + "</div>";

    // 将订单添加到全局数组（用于销售看板展示）
    orders.push({
      name: customerName,
      price: price,
      qty: quantity,
      baseTotal: baseTotal,
      finalTotal: finalTotal,
      isVip: isVip,
      isUrgent: isUrgent,
      hitTimeDiscount: hitTimeDiscount,
      extraDiscount: extraDiscount // 记录专属折扣是否生效
    });

    // 更新销售看板
    renderDashboard();
  }

  // ================================================================
  // 销售看板渲染（照抄要求代码，逐行显示历史订单）
  // ================================================================
  function renderDashboard() {
    var count = orders.length;
    var totalSales = 0;

    // 累加销售总额
    for (var i = 0; i < orders.length; i++) {
      totalSales += orders[i].finalTotal;
    }

    // 计算平均客单价（无订单时为0）
    var avg = count > 0 ? totalSales / count : 0;

    // 显示统计信息
    document.getElementById("dashboard").innerHTML =
      "<div style='font-size:16px; line-height:2;'>" +
      "<p>订单数：<strong>" + count + "</strong> 单</p>" +
      "<p>销售总额：<strong style='color:#e63946;'>¥" + totalSales.toFixed(2) + "</strong></p>" +
      "<p>平均客单价：¥" + avg.toFixed(2) + "</p>" +
      "</div>";

    // 显示订单表格
    var tableHtml = "<table><tr>" +
      "<<th>客户名称</</th>" +
      "<<th>单价（¥）</</th>" +
      "<<th>数量（件）</</th>" +
      "<<th>基础金额（¥）</</th>" +
      "<<th>最终金额（¥）</</th>" +
      "<<th>VIP</</th>" +
      "<<th>加急</</th>" +
      "<<th>时段折扣</</th>" +
      "<<th>专属折扣</</th>" + // 新增列：显示是否享受专属优惠
      "</tr>";

    // 循环渲染所有订单
    for (var j = 0; j < orders.length; j++) {
      var o = orders[j];
      tableHtml += "<tr>" +
        "<td>" + o.name + "</td>" +
        "<td>" + o.price.toFixed(2) + "</td>" +
        "<td>" + o.qty + "</td>" +
        "<td>" + o.baseTotal.toFixed(2) + "</td>" +
        "<td style='font-weight:bold;'>" + o.finalTotal.toFixed(2) + "</td>" +
        "<td>" + (o.isVip ? "是" : "否") + "</td>" +
        "<td>" + (o.isUrgent ? "是" : "否") + "</td>" +
        "<td>" + (o.hitTimeDiscount ? "是" : "否") + "</td>" +
        "<td>" + (o.extraDiscount ? "是" : "否") + "</td>" + // 显示专属折扣状态
        "</tr>";
    }

    tableHtml += "</table>";
    document.getElementById("orderTable").innerHTML = tableHtml;
  }
</script>

</body>
</html>
